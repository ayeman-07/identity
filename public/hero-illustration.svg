<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">i-Dentity Hero Illustration</title>
  <desc id="desc">Abstract dental collaboration illustration with map pins, chat bubbles, and 3D file tiles.</desc>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="50"/>
    </filter>
  </defs>

  <!-- Glow orbs -->
  <circle cx="950" cy="150" r="160" fill="url(#g1)" opacity="0.18" filter="url(#blur)"/>
  <circle cx="650" cy="680" r="200" fill="url(#g2)" opacity="0.15" filter="url(#blur)"/>

  <!-- Card stack background -->
  <g transform="translate(220,150)">
    <rect x="0" y="0" rx="24" ry="24" width="520" height="360" fill="#0F172A" opacity="0.8" stroke="white" stroke-opacity="0.08"/>
    <rect x="24" y="24" rx="16" ry="16" width="472" height="80" fill="#111827" opacity="0.9" stroke="white" stroke-opacity="0.06"/>
    <rect x="24" y="124" rx="16" ry="16" width="228" height="196" fill="#111827" opacity="0.9" stroke="white" stroke-opacity="0.06"/>
    <rect x="268" y="124" rx="16" ry="16" width="228" height="196" fill="#111827" opacity="0.9" stroke="white" stroke-opacity="0.06"/>

    <!-- Top bar content -->
    <circle cx="56" cy="64" r="10" fill="#22D3EE"/>
    <rect x="80" y="52" width="140" height="24" rx="6" fill="#1F2937"/>
    <rect x="228" y="52" width="80" height="24" rx="6" fill="#1F2937"/>

    <!-- STL tile -->
    <g transform="translate(48,152)">
      <rect x="0" y="0" width="180" height="140" rx="12" fill="#0B1220" stroke="white" stroke-opacity="0.06"/>
      <rect x="20" y="20" width="56" height="56" rx="8" fill="#0F172A" stroke="#22D3EE" stroke-opacity="0.6"/>
      <path d="M28 56 L48 28 L68 56 Z" fill="#22D3EE" opacity="0.7"/>
      <rect x="90" y="24" width="70" height="10" rx="4" fill="#1F2937"/>
      <rect x="90" y="44" width="90" height="10" rx="4" fill="#1F2937"/>
      <rect x="90" y="64" width="60" height="10" rx="4" fill="#1F2937"/>
      <rect x="20" y="92" width="140" height="12" rx="6" fill="#111827"/>
      <text x="20" y="120" font-size="12" fill="#9CA3AF">file.stl</text>
    </g>

    <!-- Chat tile -->
    <g transform="translate(292,152)">
      <rect x="0" y="0" width="180" height="140" rx="12" fill="#0B1220" stroke="white" stroke-opacity="0.06"/>
      <rect x="20" y="20" width="120" height="16" rx="6" fill="#1F2937"/>
      <rect x="20" y="46" width="140" height="12" rx="6" fill="#1F2937"/>
      <rect x="20" y="66" width="120" height="12" rx="6" fill="#1F2937"/>
      <rect x="20" y="98" width="80" height="10" rx="5" fill="#111827"/>
      <circle cx="160" cy="28" r="10" fill="#A78BFA"/>
    </g>
  </g>

  <!-- Map panel -->
  <g transform="translate(760,280)">
    <rect x="0" y="0" width="260" height="260" rx="20" fill="#0F172A" opacity="0.8" stroke="white" stroke-opacity="0.08"/>
    <rect x="16" y="16" width="228" height="228" rx="14" fill="#0B1220"/>
    <path d="M20 200 C 80 160, 180 240, 240 180" stroke="#1F2937" stroke-width="3" fill="none"/>
    <path d="M20 140 C 90 120, 150 160, 230 110" stroke="#1F2937" stroke-width="3" fill="none"/>
    <!-- pins -->
    <g>
      <path d="M80 120 C 80 100, 104 96, 110 116 C 118 144, 80 180, 80 180 C 80 180, 42 144, 50 116 C 56 96, 80 100, 80 120 Z" fill="url(#g1)"/>
      <circle cx="80" cy="130" r="7" fill="#0B1220"/>
    </g>
    <g>
      <path d="M182 170 C 182 150, 206 146, 212 166 C 220 194, 182 230, 182 230 C 182 230, 144 194, 152 166 C 158 146, 182 150, 182 170 Z" fill="url(#g2)"/>
      <circle cx="182" cy="180" r="7" fill="#0B1220"/>
    </g>
  </g>
</svg>
