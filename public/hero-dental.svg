<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="820" viewBox="0 0 1200 820" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">i-Dentity Dental Collaboration Illustration</title>
  <desc id="desc">Central luminous tooth with connected workflow nodes (clinic, lab, STL model, chat, map) and progress rings symbolizing the i-Dentity platform.</desc>
  <defs>
    <linearGradient id="gradPrimary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="gradAqua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="gradRose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <radialGradient id="toothShade" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 410) rotate(90) scale(220 180)">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#C7D2FE" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.05" />
    </radialGradient>
    <linearGradient id="toothEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.4" />
    </linearGradient>
    <radialGradient id="highlightGloss" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(560 300) rotate(25) scale(160 110)">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="blurGlow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="70" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
      </feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.6" />
    </filter>
    <filter id="innerGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b" />
      <feComposite in="b" in2="SourceGraphic" operator="atop" />
    </filter>
  </defs>

  <!-- Ambient glows -->
  <circle cx="1020" cy="160" r="200" fill="url(#gradPrimary)" opacity="0.18" filter="url(#blurGlow)" />
  <circle cx="260" cy="660" r="240" fill="url(#gradAqua)" opacity="0.14" filter="url(#blurGlow)" />
  <circle cx="860" cy="620" r="220" fill="url(#gradRose)" opacity="0.08" filter="url(#blurGlow)" />

  <!-- Center tooth (refined) -->
  <g id="tooth" transform="translate(600 400)">
    <g transform="translate(-150 -210)" filter="url(#softShadow)">
      <!-- Base silhouette -->
  <path id="toothBase" d="M150 40c50 0 89 35 99 94 5 32 4 70-5 109-7 29-19 55-32 81-7 14-13 27-18 41-7 20-13 46-18 78-8 44-16 92-30 92-16 0-23-52-30-82-6-27-13-44-23-44s-17 17-23 44c-7 30-14 82-30 82-14 0-22-48-30-92-5-32-11-58-18-78-5-14-11-27-18-41-13-26-25-52-32-81-9-39-10-77-5-109 10-59 49-94 99-94 24 0 47 10 66 29 19-19 42-29 66-29Z" fill="#FFFFFF" stroke="url(#toothEdge)" stroke-width="2.5" />
      <!-- Inner subtle contour lines -->
      <path d="M150 40c50 0 89 35 99 94 5 32 4 70-5 109-7 29-19 55-32 81" stroke="#818CF8" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round" fill="none" />
      <path d="M90 76c-26 18-43 53-42 94" stroke="#22D3EE" stroke-opacity="0.15" stroke-width="2" stroke-linecap="round" fill="none" />
      <!-- Highlight gloss -->
      <ellipse cx="120" cy="95" rx="68" ry="54" fill="url(#highlightGloss)" opacity="0.55" />
      <path d="M184 100c12 14 14 36 6 52" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round" fill="none" />
      <!-- Edge glow overlay -->
  <!-- Removed tinted overlay to keep tooth pure white -->
  <path d="M150 40c50 0 89 35 99 94 5 32 4 70-5 109-7 29-19 55-32 81-7 14-13 27-18 41-7 20-13 46-18 78-8 44-16 92-30 92-16 0-23-52-30-82-6-27-13-44-23-44s-17 17-23 44c-7 30-14 82-30 82-14 0-22-48-30-92-5-32-11-58-18-78-5-14-11-27-18-41-13-26-25-52-32-81-9-39-10-77-5-109 10-59 49-94 99-94 24 0 47 10 66 29 19-19 42-29 66-29Z" stroke="url(#gradAqua)" stroke-width="2" stroke-opacity="0.35" />
    </g>
  </g>

  <!-- Connection lines -->
  <g stroke="#1E293B" stroke-width="2" stroke-linecap="round" opacity="0.9">
    <path d="M600 400 L360 200" />
    <path d="M600 400 L880 230" />
    <path d="M600 400 L960 470" />
    <path d="M600 400 L360 560" />
    <path d="M600 400 L780 610" />
  </g>

  <!-- Nodes / feature capsules -->
  <!-- Clinic card -->
  <g transform="translate(270 150)">
    <rect width="170" height="110" rx="18" fill="#0B1220" stroke="white" stroke-opacity="0.05" />
    <rect x="18" y="22" width="90" height="16" rx="6" fill="#1E293B" />
    <rect x="18" y="46" width="130" height="12" rx="6" fill="#1E293B" />
    <rect x="18" y="66" width="100" height="12" rx="6" fill="#1E293B" />
    <circle cx="140" cy="32" r="12" fill="url(#gradAqua)" />
  </g>

  <!-- Lab card -->
  <g transform="translate(860 180)">
    <rect width="170" height="110" rx="18" fill="#0B1220" stroke="white" stroke-opacity="0.05" />
    <rect x="18" y="22" width="70" height="16" rx="6" fill="#1E293B" />
    <rect x="18" y="46" width="120" height="12" rx="6" fill="#1E293B" />
    <rect x="18" y="66" width="90" height="12" rx="6" fill="#1E293B" />
    <circle cx="140" cy="32" r="12" fill="url(#gradPrimary)" />
  </g>

  <!-- STL Model Tile -->
  <g transform="translate(290 520)">
    <rect width="200" height="150" rx="20" fill="#0B1220" stroke="white" stroke-opacity="0.05" />
    <rect x="20" y="24" width="60" height="60" rx="10" fill="#0F172A" stroke="#22D3EE" stroke-opacity="0.6" />
    <path d="M30 70 L50 38 L70 70 Z" fill="#22D3EE" opacity="0.75" />
    <rect x="96" y="30" width="70" height="12" rx="5" fill="#1E293B" />
    <rect x="96" y="50" width="90" height="12" rx="5" fill="#1E293B" />
    <rect x="96" y="70" width="65" height="12" rx="5" fill="#1E293B" />
    <rect x="20" y="100" width="160" height="14" rx="7" fill="#111827" />
    <text x="20" y="128" font-size="12" fill="#94A3B8">scan_upper.stl</text>
  </g>

  <!-- Chat Tile -->
  <g transform="translate(930 430)">
    <rect width="190" height="140" rx="20" fill="#0B1220" stroke="white" stroke-opacity="0.05" />
    <rect x="22" y="26" width="120" height="16" rx="6" fill="#1E293B" />
    <rect x="22" y="52" width="140" height="12" rx="6" fill="#1E293B" />
    <rect x="22" y="70" width="120" height="12" rx="6" fill="#1E293B" />
    <rect x="22" y="98" width="80" height="12" rx="6" fill="#111827" />
    <circle cx="160" cy="34" r="11" fill="url(#gradRose)" />
  </g>

  <!-- Map Panel -->
  <g transform="translate(720 590)">
    <rect width="210" height="170" rx="22" fill="#0F172A" stroke="white" stroke-opacity="0.05" />
    <rect x="14" y="14" width="182" height="142" rx="16" fill="#0B1220" />
    <path d="M20 120 C 60 90, 120 140, 190 80" stroke="#1F2937" stroke-width="3" fill="none" />
    <path d="M20 80 C 80 60, 140 100, 190 60" stroke="#1F2937" stroke-width="3" fill="none" />
    <g>
      <path d="M78 70 C 78 54, 96 52, 102 66 C 108 86, 78 110, 78 110 C 78 110, 48 86, 54 66 C 60 52, 78 54, 78 70 Z" fill="url(#gradPrimary)" />
      <circle cx="78" cy="78" r="6" fill="#0B1220" />
    </g>
    <g>
      <path d="M148 110 C 148 94, 166 92, 172 106 C 178 126, 148 150, 148 150 C 148 150, 118 126, 124 106 C 130 92, 148 94, 148 110 Z" fill="url(#gradAqua)" />
      <circle cx="148" cy="118" r="6" fill="#0B1220" />
    </g>
  </g>

  <!-- Status Rings / Progress around tooth with small labeled nodes -->
  <g transform="translate(600 400)" font-family="'Segoe UI', system-ui, sans-serif">
    <circle r="230" stroke="url(#gradPrimary)" stroke-width="2" stroke-dasharray="14 18" stroke-opacity="0.35" fill="none" />
    <circle r="260" stroke="url(#gradAqua)" stroke-width="2" stroke-dasharray="26 30" stroke-opacity="0.22" fill="none" />
    <circle r="290" stroke="url(#gradRose)" stroke-width="2" stroke-dasharray="40 34" stroke-opacity="0.14" fill="none" />
    <!-- Status dots -->
    <g font-size="10" text-anchor="middle" fill="#E2E8F0" font-weight="500">
      <g transform="translate(0 -230)">
        <circle r="14" fill="#0F172A" stroke="url(#gradPrimary)" stroke-width="1.5" />
        <text y="3">NEW</text>
      </g>
      <g transform="translate(200 -60)">
        <circle r="14" fill="#0F172A" stroke="url(#gradAqua)" stroke-width="1.5" />
        <text y="3">READY</text>
      </g>
      <g transform="translate(130 190)">
        <circle r="14" fill="#0F172A" stroke="url(#gradRose)" stroke-width="1.5" />
        <text y="3" font-size="9">SHIP</text>
      </g>
      <g transform="translate(-140 190)">
        <circle r="14" fill="#0F172A" stroke="url(#gradPrimary)" stroke-width="1.5" />
        <text y="3" font-size="9">DEL</text>
      </g>
      <g transform="translate(-210 -40)">
        <circle r="14" fill="#0F172A" stroke="url(#gradAqua)" stroke-width="1.5" />
        <text y="3" font-size="9">MSG</text>
      </g>
    </g>
  </g>

  <!-- Accessibility fallback hidden description for status dots -->
  <g aria-hidden="true" fill="none" />

</svg>
